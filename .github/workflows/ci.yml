name: CI

on:
  pull_request:
    branches: [Naga/MVP, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
